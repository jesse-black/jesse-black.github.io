name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update README post index
        run: |
          python3 << 'PYEOF'
          import glob, os, re
          from datetime import datetime

          def parse_date(s):
              for fmt in ('%Y-%m-%d', '%b %d %Y', '%B %d %Y', '%b %d, %Y', '%B %d, %Y'):
                  try:
                      return datetime.strptime(s.strip(), fmt)
                  except ValueError:
                      continue
              return datetime.min

          posts = []
          for filepath in glob.glob('src/content/blog/**/*.md', recursive=True) + \
                          glob.glob('src/content/blog/**/*.mdx', recursive=True):
              content = open(filepath).read()
              m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              if not m:
                  continue
              fm = {}
              for line in m.group(1).splitlines():
                  match = re.match(r"^(\w+):\s*['\"]?(.*?)['\"]?\s*$", line)
                  if match:
                      fm[match.group(1)] = match.group(2)
              slug = os.path.splitext(os.path.basename(filepath))[0]
              posts.append((
                  parse_date(fm.get('pubDate', '')),
                  fm.get('pubDate', '').strip(),
                  slug,
                  fm.get('title', slug),
                  fm.get('description', ''),
              ))

          posts.sort(reverse=True)

          lines = [
              '# jesse-black.github.io',
              '',
              'My blog at [jesseblack.net](https://jesseblack.net).',
              '',
              '## Posts',
              '',
          ]
          for _, pub_date, slug, title, desc in posts:
              url = f'https://jesseblack.net/blog/{slug}/'
              lines.append(f'- **[{title}]({url})** — {desc} _({pub_date})_')
          lines.append('')

          with open('README.md', 'w') as f:
              f.write('\n'.join(lines))
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update README post index [skip ci]" && git push)

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
